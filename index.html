<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasKeluarga - Kelola Catatan Keuangan</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel untuk kompilasi JSX di Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }
    
    @media print {
      body {
        background-color: white !important;
      }
      body > div:first-child > div:not(.print-overlay) {
        display: none !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Definisi Ikon SVG ---
    const Icon = ({ className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Sparkles = ({className}) => <Icon className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></Icon>;
    const Palette = ({className}) => <Icon className={className}><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></Icon>;
    const Filter = ({className}) => <Icon className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
    const Info = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></Icon>;
    const Wallet = ({className}) => <Icon className={className}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></Icon>;
    const ArrowUpCircle = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><polyline points="16 12 12 8 8 12"/><line x1="12" y1="16" x2="12" y2="8"/></Icon>;
    const ArrowDownCircle = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></Icon>;
    const Plus = ({className}) => <Icon className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Edit = ({className}) => <Icon className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>;
    const History = ({className}) => <Icon className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></Icon>;
    const FileText = ({className}) => <Icon className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></Icon>;
    const CheckCircle2 = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>;
    const Download = ({className}) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
    const User = ({className}) => <Icon className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
    const Trash2 = ({className}) => <Icon className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;

    // --- Data Konfigurasi ---
    const BASE_CATEGORIES = {
      Pemasukan: ['Gaji', 'Bonus', 'Investasi', 'Hadiah'],
      Pengeluaran: ['Makanan', 'Transportasi', 'Tagihan', 'Hiburan', 'Belanja', 'Kesehatan', 'Pendidikan', 'Sedekah']
    };

    const FAMILY_MEMBERS = ['Ayah', 'Ibu', 'Anak', 'Bersama'];

    const THEMES = {
      orange: { name: 'Orange', bg: 'bg-amber-50', primary: 'bg-orange-500', hover: 'hover:bg-orange-600', text: 'text-orange-600', textLight: 'text-orange-500', border: 'border-orange-500', borderLight: 'border-orange-100', light: 'bg-orange-50', ring: 'focus:border-orange-500', shadow: 'shadow-orange-200' },
      blue: { name: 'Blue', bg: 'bg-slate-50', primary: 'bg-blue-500', hover: 'hover:bg-blue-600', text: 'text-blue-600', textLight: 'text-blue-500', border: 'border-blue-500', borderLight: 'border-blue-100', light: 'bg-blue-50', ring: 'focus:border-blue-500', shadow: 'shadow-blue-200' },
      green: { name: 'Green', bg: 'bg-green-50', primary: 'bg-green-500', hover: 'hover:bg-green-600', text: 'text-green-600', textLight: 'text-green-500', border: 'border-green-500', borderLight: 'border-green-100', light: 'bg-green-50', ring: 'focus:border-green-500', shadow: 'shadow-green-200' },
      purple: { name: 'Purple', bg: 'bg-purple-50', primary: 'bg-purple-500', hover: 'hover:bg-purple-600', text: 'text-purple-600', textLight: 'text-purple-500', border: 'border-purple-500', borderLight: 'border-purple-100', light: 'bg-purple-50', ring: 'focus:border-purple-500', shadow: 'shadow-purple-200' },
      rose: { name: 'Rose', bg: 'bg-rose-50', primary: 'bg-rose-500', hover: 'hover:bg-rose-600', text: 'text-rose-600', textLight: 'text-rose-500', border: 'border-rose-500', borderLight: 'border-rose-100', light: 'bg-rose-50', ring: 'focus:border-rose-500', shadow: 'shadow-rose-200' },
    };

    // --- Komponen Utama React ---
    const App = () => {
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('catatuang_data');
        if (saved) { try { return JSON.parse(saved); } catch (e) { return []; } }
        return [];
      });
      
      const [description, setDescription] = useState('');
      const [amount, setAmount] = useState('');
      const [type, setType] = useState('Pengeluaran');
      const [category, setCategory] = useState('Makanan');
      const [customCatInput, setCustomCatInput] = useState('');
      
      const [customCategories, setCustomCategories] = useState(() => {
        const savedCat = localStorage.getItem('catatuang_categories');
        if (savedCat) { try { return JSON.parse(savedCat); } catch (e) { return { Pemasukan: [], Pengeluaran: [] }; } }
        return { Pemasukan: [], Pengeluaran: [] };
      });

      const [note, setNote] = useState('');
      const [member, setMember] = useState('Bersama');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [editId, setEditId] = useState(null);
      const [filterMember, setFilterMember] = useState('Semua');
      
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [toastMessage, setToastMessage] = useState('');
      const [showSaveConfirm, setShowSaveConfirm] = useState(false);
      
      const [activeTheme, setActiveTheme] = useState('orange');
      const t = THEMES[activeTheme];

      useEffect(() => {
        const savedTheme = localStorage.getItem('catatuang_theme');
        if (savedTheme && THEMES[savedTheme]) {
          setActiveTheme(savedTheme);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('catatuang_data', JSON.stringify(transactions));
      }, [transactions]);
      
      useEffect(() => {
        localStorage.setItem('catatuang_categories', JSON.stringify(customCategories));
      }, [customCategories]);

      useEffect(() => {
        localStorage.setItem('catatuang_theme', activeTheme);
      }, [activeTheme]);

      const handleEdit = (tr) => {
        setEditId(tr.id);
        setDescription(tr.description);
        setAmount(tr.amount.toString());
        setType(tr.type);
        setDate(tr.date);
        setNote(tr.note || '');
        setMember(tr.member || 'Bersama');
        
        if (BASE_CATEGORIES[tr.type].includes(tr.category) || customCategories[tr.type].includes(tr.category)) {
          setCategory(tr.category);
          setCustomCatInput('');
        } else {
          setCategory('Lainnya');
          setCustomCatInput(tr.category);
        }
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const cancelEdit = () => {
        setEditId(null);
        setDescription('');
        setAmount('');
        setNote('');
        setCustomCatInput('');
        setType('Pengeluaran');
        setCategory(BASE_CATEGORIES['Pengeluaran'][0]);
        setDate(new Date().toISOString().split('T')[0]);
      };

      const confirmAddTransaction = () => {
        let finalCategory = category;
        if (category === 'Lainnya' && customCatInput.trim() !== '') {
          finalCategory = customCatInput.trim();
          if (!customCategories[type].includes(finalCategory)) {
            setCustomCategories(prev => ({
              ...prev,
              [type]: [...prev[type], finalCategory]
            }));
          }
        }

        const parsedAmount = parseFloat(amount) || 0;

        if (editId) {
          setTransactions(transactions.map(tr => 
            tr.id === editId ? {
              ...tr, description, amount: parsedAmount, type, category: finalCategory, note, member, date
            } : tr
          ));
          setEditId(null);
        } else {
          const newTransaction = {
            id: Date.now(), description, amount: parsedAmount, type, category: finalCategory, note, member, date
          };
          setTransactions([newTransaction, ...transactions]);
        }
        
        setDescription('');
        setAmount('');
        setNote('');
        setCustomCatInput('');
        setCategory(BASE_CATEGORIES[type][0]);
        setDate(new Date().toISOString().split('T')[0]);
        setShowSaveConfirm(false);
        
        setToastMessage('Data berhasil disimpan!');
        setTimeout(() => setToastMessage(''), 3000);
      };

      const deleteTransaction = (id) => {
        setConfirmDeleteId(id);
      };

      const confirmDelete = (id) => {
        setTransactions(transactions.filter(tr => tr.id !== id));
        setConfirmDeleteId(null);
      };

      const stats = useMemo(() => {
        const filtered = transactions.filter(tr => {
          return filterMember === 'Semua' || tr.member === filterMember;
        });

        const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));

        const income = filtered
          .filter(tr => tr.type === 'Pemasukan')
          .reduce((acc, tr) => acc + tr.amount, 0);
        
        const expense = filtered
          .filter(tr => tr.type === 'Pengeluaran')
          .reduce((acc, tr) => acc + tr.amount, 0);

        return { income, expense, balance: income - expense, filteredTransactions: sorted };
      }, [transactions, filterMember]);

      const formatIDR = (num) => {
        return new Intl.NumberFormat('id-ID', {
          style: 'currency', currency: 'IDR', maximumFractionDigits: 0
        }).format(num);
      };

      const getPeriodText = () => {
        if (stats && stats.filteredTransactions && stats.filteredTransactions.length > 0) {
          const dates = stats.filteredTransactions.map(t => new Date(t.date));
          const minDate = new Date(Math.min(...dates));
          const maxDate = new Date(Math.max(...dates));
          const format = (d) => d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
          if (minDate.getTime() === maxDate.getTime()) {
            return format(minDate);
          }
          return `${format(minDate)} - ${format(maxDate)}`;
        }
        return 'Hari Ini';
      };

      const exportToExcel = () => {
        if (stats.filteredTransactions.length === 0) {
          setToastMessage('Tidak ada data untuk diekspor!');
          setTimeout(() => setToastMessage(''), 3000);
          return;
        }

        const BOM = '\uFEFF';
        const separator = ';';
        const headers = ['Tanggal', 'Deskripsi', 'Kategori', 'Anggota', 'Tipe', 'Jumlah (Rp)', 'Catatan'].join(separator);
        
        const csvRows = [headers];

        stats.filteredTransactions.forEach(tr => {
          const safeDesc = `"${(tr.description || '').replace(/"/g, '""')}"`;
          const safeNote = `"${(tr.note || '').replace(/"/g, '""')}"`;
          const row = [
            tr.date, safeDesc, tr.category, tr.member, tr.type, tr.amount, safeNote
          ];
          csvRows.push(row.join(separator));
        });

        csvRows.push('');
        csvRows.push(',,,,Total Pemasukan' + separator + stats.income);
        csvRows.push(',,,,Total Pengeluaran' + separator + stats.expense);
        csvRows.push(',,,,Sisa Saldo' + separator + stats.balance);

        const blob = new Blob([BOM + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        
        let dateString = new Date().toISOString().split('T')[0];
        if (stats.filteredTransactions.length > 0) {
          const dates = stats.filteredTransactions.map(t => new Date(t.date));
          const minD = new Date(Math.min(...dates)).toISOString().split('T')[0];
          const maxD = new Date(Math.max(...dates)).toISOString().split('T')[0];
          dateString = minD === maxD ? minD : `${minD}_sd_${maxD}`;
        }
        
        link.setAttribute('download', `Laporan_Kas_${dateString}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        setToastMessage('Laporan Excel berhasil diunduh!');
        setTimeout(() => setToastMessage(''), 3000);
      };

      const generatePDFReport = () => {
        if (stats.filteredTransactions.length === 0) {
          setToastMessage('Tidak ada data untuk dicetak!');
          setTimeout(() => setToastMessage(''), 3000);
          return;
        }

        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          setToastMessage('Pop-up diblokir. Silakan izinkan pop-up browser.');
          setTimeout(() => setToastMessage(''), 3000);
          return;
        }

        const rows = stats.filteredTransactions.map(tr => `
          <tr class="border-b border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 px-4 text-sm font-medium whitespace-nowrap">
              ${new Date(tr.date).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })}
            </td>
            <td class="py-3 px-4">
              <p class="font-bold text-slate-800 text-sm">${tr.description}</p>
              ${tr.note ? `<p class="text-xs text-slate-500 mt-0.5">${tr.note}</p>` : ''}
            </td>
            <td class="py-3 px-4 text-sm">
              <span class="font-bold text-slate-800">${tr.category}</span>
              <span class="text-slate-300 mx-2">|</span>
              <span class="text-slate-600 font-medium">${tr.member}</span>
            </td>
            <td class="py-3 px-4 text-sm font-black text-emerald-600 text-right whitespace-nowrap">
              ${tr.type === 'Pemasukan' ? formatIDR(tr.amount) : '-'}
            </td>
            <td class="py-3 px-4 text-sm font-black text-red-600 text-right whitespace-nowrap">
              ${tr.type === 'Pengeluaran' ? formatIDR(tr.amount) : '-'}
            </td>
          </tr>
        `).join('');

        const html = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>Laporan Kas - ${getPeriodText()}</title>
            <script src="https://cdn.tailwindcss.com"><\/script>
          </head>
          <body class="bg-white p-8 font-sans text-slate-800">
            <div class="max-w-4xl mx-auto">
              <div class="text-center mb-8 border-b-2 border-slate-800 pb-6">
                <h1 class="text-2xl sm:text-3xl font-black mb-2 uppercase tracking-tight">LAPORAN KEUANGAN KELUARGA</h1>
                <div class="text-slate-600 font-medium space-y-1">
                  <p>Anggota: <span class="font-bold">${filterMember}</span> | Periode: <span class="font-bold">${getPeriodText()}</span></p>
                  <p class="text-sm">Dicetak pada: <span class="font-bold">${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</span></p>
                </div>
              </div>
              
              <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                  <p class="text-sm font-bold text-slate-500 uppercase">Total Pemasukan</p>
                  <p class="text-xl sm:text-2xl font-black text-emerald-600">${formatIDR(stats.income)}</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                  <p class="text-sm font-bold text-slate-500 uppercase">Total Pengeluaran</p>
                  <p class="text-xl sm:text-2xl font-black text-red-600">${formatIDR(stats.expense)}</p>
                </div>
                <div class="bg-slate-100 p-4 rounded-xl border border-slate-300 text-center">
                  <p class="text-sm font-bold text-slate-800 uppercase">Sisa Saldo</p>
                  <p class="text-xl sm:text-2xl font-black text-slate-800">${formatIDR(stats.balance)}</p>
                </div>
              </div>

              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b-2 border-slate-300 bg-slate-50">
                    <th class="py-3 px-4 font-bold text-sm text-slate-700">Tanggal</th>
                    <th class="py-3 px-4 font-bold text-sm text-slate-700">Keterangan & Catatan</th>
                    <th class="py-3 px-4 font-bold text-sm text-slate-700">Kategori / Anggota</th>
                    <th class="py-3 px-4 font-bold text-sm text-slate-700 text-right">Pemasukan</th>
                    <th class="py-3 px-4 font-bold text-sm text-slate-700 text-right">Pengeluaran</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows}
                </tbody>
              </table>
            </div>
            <script>
              window.onload = () => {
                setTimeout(() => { window.print(); }, 800);
              };
            <\/script>
          </body>
          </html>
        `;

        printWindow.document.write(html);
        printWindow.document.close();
      };

      return (
        <div className={`min-h-screen ${t.bg} font-sans text-slate-800 pb-12 transition-colors duration-300`}>
          <div className={`${t.primary} text-white py-2 px-4 text-center text-xs font-bold tracking-widest flex justify-center items-center gap-2 transition-colors duration-300`}>
            <Sparkles className="w-3 h-3" />
            KELOLA CATATAN KEUANGAN KELUARGA
            <Sparkles className="w-3 h-3" />
          </div>

          <div className="max-w-5xl mx-auto p-4 md:p-8">
            <header className="mb-8 flex flex-col lg:flex-row lg:items-end justify-between gap-6">
              <div>
                <h1 className={`text-5xl font-black ${t.text} tracking-tighter flex items-center gap-2 transition-colors duration-300`}>
                  Kas<span className="text-slate-800">Keluarga</span>
                  <div className={`w-3 h-3 ${t.primary} rounded-full animate-bounce mt-4`}></div>
                </h1>
                <p className="text-slate-500 font-medium ml-1 mt-1 flex items-center gap-2">
                  Wujudkan impian keluarga dengan finansial yang sehat 🚀
                </p>
              </div>
              
              <div className="flex flex-col sm:flex-row items-center gap-3">
                <div className="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200">
                  <Palette className="w-4 h-4 text-slate-400 ml-1" />
                  {Object.keys(THEMES).map(key => (
                    <button
                      key={key}
                      onClick={() => setActiveTheme(key)}
                      className={`w-6 h-6 rounded-full transition-all ${THEMES[key].primary} ${activeTheme === key ? 'ring-2 ring-offset-2 ring-slate-800 scale-110' : 'opacity-70 hover:opacity-100'}`}
                      title={`Tema ${THEMES[key].name}`}
                    />
                  ))}
                </div>

                <div className={`flex flex-wrap items-center gap-3 bg-white p-3 rounded-2xl shadow-md border-2 ${t.borderLight}`}>
                  <div className="flex items-center gap-2 border-r pr-3 border-slate-100">
                    <Filter className={`w-4 h-4 ${t.textLight}`} />
                    <select 
                      className="bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 cursor-pointer outline-none"
                      value={filterMember}
                      onChange={(e) => setFilterMember(e.target.value)}
                    >
                      <option value="Semua">🏠 Semua Anggota</option>
                      {FAMILY_MEMBERS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                </div>
              </div>
            </header>

            <div className="bg-blue-50 border border-blue-200 p-4 sm:p-5 rounded-2xl mb-8 flex gap-3 sm:gap-4 items-start shadow-sm no-print">
              <Info className="w-6 h-6 text-blue-500 flex-shrink-0 mt-0.5" />
              <div className="text-sm text-blue-800">
                <p className="font-bold mb-1 text-base">Panduan Penggunaan Penting:</p>
                <ul className="list-disc pl-4 space-y-1">
                  <li><strong className="text-red-600">PENTING:</strong> Pengisian data ini bersifat <strong>SATU KALI PEMAKAIAN (per sesi)</strong>. Data tidak dapat dipanggil ulang jika aplikasi sudah ditutup atau di-*refresh*.</li>
                  <li>Sangat disarankan untuk <strong>Menyimpan Data ke Excel</strong> atau <strong>Mencetak Laporan (PDF)</strong> hari ini sebelum meninggalkan halaman.</li>
                </ul>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 no-print">
              <div className={`${t.primary} p-8 rounded-[2rem] shadow-xl text-white relative overflow-hidden flex flex-col justify-center transition-colors duration-300`}>
                <div className="absolute -right-6 -bottom-6 opacity-20">
                  <Wallet className="w-40 h-40" />
                </div>
                <p className="text-white/80 text-sm font-bold mb-2 uppercase flex items-center gap-2">
                  Total Saldo
                </p>
                <h2 className="text-4xl font-black relative z-10">{formatIDR(stats.balance)}</h2>
              </div>

              <div className="bg-white p-8 rounded-[2rem] shadow-lg border-2 border-white flex flex-col justify-center">
                <div className="flex items-center gap-3 mb-2">
                  <div className="p-2 bg-emerald-100 rounded-xl">
                    <ArrowUpCircle className="w-6 h-6 text-emerald-600" />
                  </div>
                  <p className="text-slate-500 text-sm font-bold uppercase">Pemasukan</p>
                </div>
                <h2 className="text-3xl font-black text-emerald-600">{formatIDR(stats.income)}</h2>
              </div>

              <div className="bg-white p-8 rounded-[2rem] shadow-lg border-2 border-white flex flex-col justify-center">
                <div className="flex items-center gap-3 mb-2">
                  <div className="p-2 bg-red-100 rounded-xl">
                    <ArrowDownCircle className="w-6 h-6 text-red-500" />
                  </div>
                  <p className="text-slate-500 text-sm font-bold uppercase">Pengeluaran</p>
                </div>
                <h2 className="text-3xl font-black text-red-500">{formatIDR(stats.expense)}</h2>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
              <div className="lg:col-span-5">
                <div className={`bg-white p-8 rounded-[2.5rem] shadow-xl border-4 ${t.borderLight} relative transition-colors duration-300`}>
                  <div className="absolute -top-4 right-8 bg-yellow-400 text-yellow-900 font-black px-4 py-1 rounded-lg text-sm shadow-sm flex items-center gap-1">
                    {editId ? <Edit className="w-4 h-4" /> : <Plus className="w-4 h-4" />} 
                    {editId ? 'EDIT DATA!' : 'TAMBAH BARU!'}
                  </div>
                  <h3 className="text-2xl font-black mb-8 text-slate-800 flex items-center gap-3">
                    {editId ? (
                      <Edit className={`w-8 h-8 p-1 ${t.primary} text-white rounded-full transition-colors`} />
                    ) : (
                      <Plus className={`w-8 h-8 p-1 ${t.primary} text-white rounded-full transition-colors`} />
                    )}
                    {editId ? 'Edit Kas' : 'Catat Kas'}
                  </h3>
                  <form onSubmit={(e) => { e.preventDefault(); setShowSaveConfirm(true); }} className="space-y-6">
                    <div className="space-y-2">
                      <label className="text-sm font-black text-slate-600 ml-1">Deskripsi</label>
                      <input 
                        type="text" 
                        placeholder="Contoh: Belanja Bulanan..."
                        className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-bold`}
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        required
                      />
                    </div>

                    <div className="space-y-2">
                      <label className="text-sm font-black text-slate-600 ml-1">Jumlah (Rp)</label>
                      <input 
                        type="number" 
                        placeholder="0"
                        className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-bold`}
                        value={amount}
                        onChange={(e) => setAmount(e.target.value)}
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div className="space-y-2">
                        <label className="text-sm font-black text-slate-600 ml-1">Tanggal</label>
                        <input 
                          type="date" 
                          className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-bold`}
                          value={date}
                          onChange={(e) => setDate(e.target.value)}
                          required
                        />
                      </div>
                      <div className="space-y-2">
                        <label className="text-sm font-black text-slate-600 ml-1">Tipe</label>
                        <select 
                          className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-bold`}
                          value={type}
                          onChange={(e) => {
                            setType(e.target.value);
                            setCategory(BASE_CATEGORIES[e.target.value][0]);
                            setCustomCatInput('');
                          }}
                        >
                          <option value="Pengeluaran">🔴 Keluar</option>
                          <option value="Pemasukan">🟢 Masuk</option>
                        </select>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <label className="text-sm font-black text-slate-600 ml-1">Kategori</label>
                      <select 
                        className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-bold`}
                        value={category}
                        onChange={(e) => setCategory(e.target.value)}
                      >
                        {BASE_CATEGORIES[type].map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                        {customCategories[type].map(cat => (
                          <option key={`custom-${cat}`} value={cat}>{cat}</option>
                        ))}
                        <option value="Lainnya">✨ Lainnya...</option>
                      </select>
                    </div>

                    {category === 'Lainnya' && (
                      <div className="space-y-2">
                        <label className="text-sm font-black text-slate-600 ml-1">Nama Kategori Baru</label>
                        <div className="flex gap-2">
                          <input 
                            type="text" 
                            placeholder="Masukkan kategori baru..."
                            className={`w-full px-5 py-4 rounded-2xl border-2 ${t.borderLight} ${t.ring} outline-none ${t.light} font-bold ${t.text} transition-all`}
                            value={customCatInput}
                            onChange={(e) => setCustomCatInput(e.target.value)}
                            required
                          />
                          <button
                            type="button"
                            onClick={() => {
                              const newCat = customCatInput.trim();
                              if (newCat) {
                                if (!customCategories[type].includes(newCat) && !BASE_CATEGORIES[type].includes(newCat)) {
                                  setCustomCategories(prev => ({
                                    ...prev,
                                    [type]: [...prev[type], newCat]
                                  }));
                                }
                                setCategory(newCat);
                                setCustomCatInput('');
                              }
                            }}
                            className={`px-5 rounded-2xl font-black text-white ${t.primary} ${t.hover} transition-all shadow-md flex items-center justify-center`}
                            title="Tambahkan ke daftar opsi kategori"
                          >
                            <Plus className="w-6 h-6" />
                          </button>
                        </div>
                      </div>
                    )}

                    <div className="space-y-2">
                      <label className="text-sm font-black text-slate-600 ml-1">Catatan Tambahan (Opsional)</label>
                      <input 
                        type="text" 
                        placeholder="Contoh: Beli di warung bu Asri"
                        className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-medium`}
                        value={note}
                        onChange={(e) => setNote(e.target.value)}
                      />
                    </div>

                    <div className="space-y-2">
                      <label className="text-sm font-black text-slate-600 ml-1">Siapa Pemakainya?</label>
                      <select 
                        className={`w-full px-5 py-4 rounded-2xl border-2 border-slate-100 ${t.ring} outline-none bg-slate-50 font-bold`}
                        value={member}
                        onChange={(e) => setMember(e.target.value)}
                      >
                        {FAMILY_MEMBERS.map(m => (
                          <option key={m} value={m}>{m}</option>
                        ))}
                      </select>
                    </div>

                    <div className="flex gap-3 mt-2">
                      {editId && (
                        <button 
                          type="button"
                          onClick={cancelEdit}
                          className="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black py-5 rounded-[1.5rem] transition-all shadow-sm flex items-center justify-center text-lg"
                        >
                          BATAL
                        </button>
                      )}
                      <button 
                        type="submit"
                        className={`${editId ? 'w-2/3' : 'w-full'} ${t.primary} ${t.hover} hover:scale-[1.02] active:scale-[0.98] text-white font-black py-5 rounded-[1.5rem] transition-all shadow-xl ${t.shadow} flex items-center justify-center gap-3 text-lg`}
                      >
                        {editId ? 'UPDATE SEKARANG' : 'SIMPAN SEKARANG'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>

              <div className="lg:col-span-7">
                <div className="bg-white rounded-[2.5rem] shadow-xl border-4 border-white overflow-hidden min-h-[600px] flex flex-col">
                  <div className={`p-6 sm:p-8 ${t.primary} flex flex-col gap-5 transition-colors duration-300`}>
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                      <div>
                        <h3 className="text-xl font-black text-white flex items-center gap-3">
                          <History className="w-6 h-6" />
                          Riwayat Catatan
                        </h3>
                        <p className="text-white/80 text-sm font-medium mt-1">
                          {new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                        </p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button 
                          onClick={generatePDFReport}
                          className="bg-slate-900/20 hover:bg-slate-900/40 text-white text-xs font-black px-4 py-2 rounded-xl shadow-sm flex items-center gap-2 transition-all active:scale-95"
                        >
                          <FileText className="w-4 h-4" /> LAPORAN KAS (PDF)
                        </button>
                        <span className={`bg-white ${t.text} text-xs font-black px-4 py-2 rounded-xl shadow-inner`}>
                          {stats.filteredTransactions.length} DATA
                        </span>
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-2 bg-white/10 p-3 rounded-2xl border border-white/20">
                      <div className="flex items-center gap-2 text-white/90">
                        <CheckCircle2 className="w-4 h-4" />
                        <span className="text-sm font-bold">Pastikan simpan data Anda hari ini.</span>
                      </div>
                      
                      <div className="flex gap-2 w-full sm:w-auto">
                        <button 
                          onClick={exportToExcel}
                          className="flex-1 sm:flex-none bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-black px-5 py-2.5 rounded-xl transition-all shadow-sm border border-emerald-400 flex items-center justify-center gap-2"
                        >
                          <Download className="w-4 h-4" /> SIMPAN EXCEL
                        </button>
                      </div>
                    </div>
                  </div>
                  
                  <div className="divide-y-2 divide-slate-50 flex-1 overflow-y-auto custom-scrollbar relative">
                    {toastMessage && (
                      <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10 bg-emerald-500 text-white px-5 py-2.5 rounded-full font-bold text-sm shadow-xl animate-bounce flex items-center gap-2">
                        <Sparkles className="w-4 h-4" /> {toastMessage}
                      </div>
                    )}
                    {stats.filteredTransactions.length === 0 ? (
                      <div className="p-20 text-center">
                        <div className={`${t.light} w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-white shadow-md`}>
                          <Sparkles className={`w-12 h-12 ${t.textLight}`} />
                        </div>
                        <p className="text-slate-400 font-bold text-lg">Belum ada uang yang dicatat nih!</p>
                        <p className="text-slate-300 text-sm mt-1">Ayo mulai catat pengeluaranmu hari ini.</p>
                      </div>
                    ) : (
                      stats.filteredTransactions.map((tr) => (
                        <div key={tr.id} className={`p-6 hover:${t.bg} transition-all group border-l-[6px] border-transparent hover:${t.border}`}>
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-5">
                              <div className={`w-14 h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm ${
                                tr.type === 'Pemasukan' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'
                              }`}>
                                <span className="text-[10px] font-black uppercase opacity-80 leading-none mb-1">
                                  {new Date(tr.date).toLocaleDateString('id-ID', { month: 'short' })}
                                </span>
                                <span className="text-lg font-black leading-none">
                                  {new Date(tr.date).getDate()}
                                </span>
                              </div>
                              <div>
                                <h4 className="font-black text-slate-800 text-lg leading-tight mb-1">{tr.description}</h4>
                                <div className="flex flex-wrap items-center gap-3 text-xs mb-1.5">
                                  <span className="flex items-center gap-1 font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md">
                                    <User className="w-3 h-3" /> {tr.member}
                                  </span>
                                  <span className={`font-black ${t.textLight} uppercase tracking-tighter`}>
                                    {tr.category}
                                  </span>
                                  <span className="text-slate-400 font-medium italic">
                                    {new Date(tr.date).toLocaleDateString('id-ID', { weekday: 'long' })}
                                  </span>
                                </div>
                                {tr.note && (
                                  <p className="text-sm text-slate-500 font-medium flex items-start gap-1 mt-1">
                                    <span className="text-slate-300">↳</span> {tr.note}
                                  </p>
                                )}
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="text-right">
                                <span className={`text-lg sm:text-xl font-black block ${
                                  tr.type === 'Pemasukan' ? 'text-emerald-600' : 'text-red-600'
                                }`}>
                                  {tr.type === 'Pemasukan' ? '+' : '-'} {formatIDR(tr.amount)}
                                </span>
                              </div>
                              <div className="flex flex-col sm:flex-row gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button 
                                  onClick={() => handleEdit(tr)}
                                  className="p-2 text-slate-300 hover:text-blue-600 hover:bg-blue-100 rounded-xl transition-all"
                                  title="Edit Catatan"
                                >
                                  <Edit className="w-4 h-4 sm:w-5 sm:h-5" />
                                </button>
                                {confirmDeleteId === tr.id ? (
                                  <div className="flex items-center gap-1 bg-red-50 rounded-xl p-1">
                                    <button onClick={() => confirmDelete(tr.id)} className="px-3 py-1 bg-red-500 text-white text-xs font-bold rounded-lg hover:bg-red-600 transition-colors">Ya, Hapus</button>
                                    <button onClick={() => setConfirmDeleteId(null)} className="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-300 transition-colors">Batal</button>
                                  </div>
                                ) : (
                                  <button 
                                    onClick={() => deleteTransaction(tr.id)}
                                    className="p-2 text-slate-300 hover:text-red-600 hover:bg-red-100 rounded-xl transition-all"
                                    title="Hapus Catatan"
                                  >
                                    <Trash2 className="w-4 h-4 sm:w-5 sm:h-5" />
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <footer className="mt-8 mb-6 text-center text-slate-500 text-sm font-medium no-print">
            <p>Copyright © {new Date().getFullYear()} PodjokDigitals</p>
            <a 
              href="https://lynk.id/PodjokDigitals" 
              target="_blank" 
              rel="noopener noreferrer"
              className={`inline-block mt-3 font-bold ${t.text} hover:text-white ${t.hover} px-5 py-2 rounded-full transition-all border ${t.borderLight} ${t.light}`}
            >
              Lihat Produk Lainnya
            </a>
          </footer>

          {showSaveConfirm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4 no-print">
              <div className="bg-white max-w-sm w-full rounded-3xl shadow-2xl p-6 border-t-8 border-blue-500 text-center animate-in fade-in zoom-in duration-200">
                <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <CheckCircle2 className="w-8 h-8 text-blue-500" />
                </div>
                <h3 className="text-2xl font-black text-slate-800 mb-2">Simpan Data?</h3>
                <p className="text-slate-600 font-medium mb-6">
                  Apakah data yang Anda masukkan sudah sesuai?
                </p>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setShowSaveConfirm(false)}
                    className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-colors"
                  >
                    Cek Lagi
                  </button>
                  <button 
                    onClick={confirmAddTransaction}
                    className="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition-colors"
                  >
                    Ya, Sesuai
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
